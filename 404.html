<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | MBS Advisory</title>
    <link rel="icon" href="/MBS/favicon.svg" type="image/svg+xml">
    <style>
        :root { --bg: #f7f9ff; --text: #080f1e; --muted: #4b5670; --accent: #1b3bff; }
        @media (prefers-color-scheme: dark) { :root { --bg: #070d1a; --text: #eef1f8; --muted: #9aa6c2; --accent: #5577ff; } }
        * { box-sizing: border-box; margin: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
               background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .code { font-family: Georgia, serif; font-size: 5rem; color: var(--accent); line-height: 1; }
        h1 { margin-top: 16px; font-size: 1.5rem; font-weight: 600; }
        p { margin-top: 10px; color: var(--muted); }
        a { display: inline-block; margin-top: 28px; padding: 12px 28px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>Page not found · Página não encontrada</h1>
        <p>The page you are looking for does not exist or has moved.</p>
        <a href="/MBS/">MBS Advisory — Home</a>
    </main>
</body>
</html>
